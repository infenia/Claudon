name: Manual Nuitka Build & Release Standalone Binaries

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0 or v0.2.0b1)'
        required: true
        default: 'v0.1.0'
      is_prerelease:
        description: 'Mark as GitHub Prerelease / Beta'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release-binary:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: claudon-linux-x86_64
            bin_name: claudon.bin
          - os: macos-latest
            artifact_name: claudon-macos-x86_64
            bin_name: claudon.bin
          - os: windows-latest
            artifact_name: claudon-windows-x86_64.exe
            bin_name: claudon.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Nuitka and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard ordered-set

      - name: Build standalone executable with Nuitka
        run: |
          python scripts/build_nuitka.py --onefile --output-dir dist

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p release_assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/claudon.exe release_assets/${{ matrix.artifact_name }}
          else
            cp dist/claudon.bin release_assets/${{ matrix.artifact_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/

      - name: Release to GitHub Releases (Manual Trigger)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          prerelease: ${{ inputs.is_prerelease }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
