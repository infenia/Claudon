name: Build & Release Standalone Binaries

# Dispatch on the release tag, never a branch:
#   gh workflow run nuitka-build.yml --ref vX.Y.Z
# Tags containing '-' (e.g. v0.2.0-beta.1) are published as GitHub prereleases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a release tag: gh workflow run nuitka-build.yml --ref vX.Y.Z"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches claudon.__version__ and package.json
        run: python scripts/check_version.py "${{ github.ref_name }}"

  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.asset }}
    needs: [preflight, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, asset: claudon-linux-x86_64 }        # oldest supported image = widest glibc compatibility
          - { os: macos-26, asset: claudon-macos-arm64 }
          - { os: macos-26-intel, asset: claudon-macos-x86_64 }
          - { os: windows-latest, asset: claudon-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Nuitka
        run: python -m pip install nuitka==4.2.2 zstandard==0.25.0
      - name: Build standalone executable with Nuitka
        run: python scripts/build_nuitka.py --onefile --output-dir dist
      - name: Smoke test and stage binary
        shell: bash
        run: |
          src=dist/claudon.bin
          if [ "$RUNNER_OS" = "Windows" ]; then src=dist/claudon.exe; fi
          "./$src" --version
          mkdir -p release_assets
          cp "$src" "release_assets/${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: release_assets/
          if-no-files-found: error

  # One job publishes, after every platform built: no racing release creation,
  # and the write-scoped token never reaches the build steps.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release_assets
          merge-multiple: true
      - name: Checksums
        run: cd release_assets && sha256sum claudon-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release_assets/claudon-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release_assets/*
          fail_on_unmatched_files: true
