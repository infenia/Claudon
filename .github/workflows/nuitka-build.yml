name: Nuitka Build Standalone Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binary:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Nuitka and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard ordered-set

      - name: Build standalone executable with Nuitka
        run: |
          python scripts/build_nuitka.py --onefile --output-dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudon-binary-${{ matrix.os }}
          path: dist/
