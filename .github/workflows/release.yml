name: Publish Release (PyPI & npm)

# Dispatch on the release tag, never a branch:
#   gh workflow run release.yml --ref vX.Y.Z -f npm_tag=latest
on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag (latest for stable; beta/next for prereleases)'
        required: true
        default: 'latest'
      publish_pypi:
        description: 'Publish to PyPI'
        type: boolean
        required: false
        default: true
      publish_npm:
        description: 'Publish to npm'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a release tag: gh workflow run release.yml --ref vX.Y.Z"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches claudon.__version__ and package.json
        run: python scripts/check_version.py "${{ github.ref_name }}"
      - name: Prereleases must not take the npm 'latest' dist-tag
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            *-*) if [ "$NPM_TAG" = "latest" ]; then echo "::error::$REF is a prerelease; use npm_tag=beta or next"; exit 1; fi ;;
          esac

  ci:
    uses: ./.github/workflows/ci.yml

  build-dist:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build PyPI distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (uvx / pipx / pip)
    needs: build-dist
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no API token. One-time setup on PyPI:
    # owner infenia, repo Claudon, workflow release.yml, environment pypi.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-npm:
    name: Publish to npm (npx / bunx)
    needs: [preflight, ci]
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write              # npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm with tag
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
