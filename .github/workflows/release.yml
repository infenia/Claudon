name: Publish Release (PyPI & npm)

# Dispatch on the release tag, never a branch:
#   gh workflow run release.yml --ref vX.Y.Z -f npm_tag=latest
on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag (latest for stable; beta/next for prereleases)'
        required: true
        default: 'latest'
      publish_pypi:
        description: 'Publish to PyPI'
        type: boolean
        required: false
        default: true
      publish_npm:
        description: 'Publish to npm'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a release tag: gh workflow run release.yml --ref vX.Y.Z"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches claudon.__version__ and package.json
        env:
          REF: ${{ github.ref_name }}          # via env, never interpolated into the script
        run: python scripts/check_version.py "$REF"
      - name: npm dist-tag matches the release type
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            *-*) if [ "$NPM_TAG" = "latest" ]; then echo "::error::$REF is a prerelease; use npm_tag=beta or next"; exit 1; fi ;;
            *) if [ "$NPM_TAG" != "latest" ]; then echo "::error::$REF is a stable release; use npm_tag=latest"; exit 1; fi ;;
          esac

  ci:
    uses: ./.github/workflows/ci.yml

  build-dist:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build PyPI distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (uvx / pipx / pip)
    needs: build-dist
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no API token. One-time setup on PyPI:
    # owner infenia, repo claudon, workflow release.yml, environment pypi.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Trusted publishing, no token. One-time setup on npm (package settings): owner infenia, repo claudon,
  # workflow release.yml, no environment. The first publish of a new package must be done by hand.
  publish-npm:
    name: Publish to npm (npx / bunx)
    needs: [preflight, ci]
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write              # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24            # npm >= 11.5.1 is required for trusted publishing
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm with tag
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
