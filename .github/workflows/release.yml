name: Manual Publish Release (PyPI & npm)

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag (e.g. latest, beta, next)'
        required: true
        default: 'latest'
      publish_pypi:
        description: 'Publish to PyPI'
        type: boolean
        required: false
        default: true
      publish_npm:
        description: 'Publish to npm'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-pypi:
    name: Publish to PyPI (uvx / pipx / pip)
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build PyPI distribution
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypa-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

  publish-npm:
    name: Publish to npm (npx / bunx)
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm with tag
        run: npm publish --access public --tag ${{ inputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
