name: Release Please

# Keeps a "release X.Y.Z" PR (version bump + CHANGELOG) up to date from Conventional Commits on main.
# Merging that PR tags vX.Y.Z, creates the GitHub Release and dispatches the publish workflows on the tag.
# See docs/RELEASING.md.
on:
  push:
    branches: [ main ]

permissions:
  contents: write         # tag + GitHub Release
  pull-requests: write    # the release PR
  actions: write          # dispatch the publish workflows

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # A PAT/App token makes CI run on the release PR (GITHUB_TOKEN-created PRs don't trigger workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tags created with GITHUB_TOKEN don't fire other workflows, but workflow_dispatch does work.
      - name: Dispatch publish workflows on the new tag
        if: ${{ steps.rp.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          case "$TAG" in *-*) npm_tag=beta ;; *) npm_tag=latest ;; esac
          gh workflow run release.yml      --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f npm_tag="$npm_tag"
          gh workflow run nuitka-build.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
