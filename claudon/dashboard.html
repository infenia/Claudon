// Every threshold a Bottlenecks rule compares against (shares are fractions, times in seconds, spend in $).
const RULES={idleShare:.4,idleMinWall:60,approvalTotal:120,toolErrCalls:8,toolErrRate:.15,errStreak:3,dupCalls:5,churnEdits:10,ctxBig:4e5,

const SEV={hi:0,mid:1,info:2},SUBTIP='Independent subagents can run in parallel: ask for them in one message instead of one after another.';
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>'),base=p=>String(p).split(/[\\/]/).pop(),cut=s=>s.length>40?'…'+s.slice(-39):s;
const tn=(n,one,many)=>`${n} ${n==1?one:many}`;
// Findings over a task list, worst first: {key, sev, title, why, fix, tasks, s, usd}; s / usd = estimated time and spend at stake.
function findings(F){const a=A(F),out=[],tools=toolAgg(F),by=(l,f,n=6)=>[...l].sort((x,y)=>f(y)-f(x)).slice(0,n).map(t=>t.id);
 const turns=Math.max(1,a.calls+a.sub),turn=a.model/turns,turnUsd=a.cost/turns;     // what one extra model round-trip costs on average
 const add=(key,sev,title,why,fix,tasks=[],s=0,usd=0)=>out.push({key,sev,title,why,fix,tasks,s,usd});
 const errs=t=>sum(Object.values(t.tool_stats),v=>v[1]),rejects=t=>sum(Object.values(t.tool_stats),v=>v[4]);
 const idle=F.filter(t=>t.wall>RULES.idleMinWall&&t.wait_s/t.wall>RULES.idleShare);
 if(idle.length){const s=sum(idle,t=>t.wait_s);add('idle',s/a.wall>.15?'hi':'mid',`${tn(idle.length,'task was','tasks were')} mostly idle (over ${P(RULES.idleShare)} of the time with no model or tool activity)`,
  `${T(s)} idle. That is time spent waiting on something the transcript doesn't record: you reading or away, a background job, or slow hooks and startup.`,
  'Answer the agent\'s questions in one go and wrap up a step before stepping away. If hooks are slow, time them with `claude --debug`.',by(idle,t=>t.wait_s),s)}
 const ap=sum(F,t=>t.approval_s);
 if(ap>=RULES.approvalTotal){const l=F.filter(t=>t.approval_s>0);add('approval',ap/a.wall>.05?'hi':'mid',`Permission prompts held up ${T(ap)} of work`,
  `Read, Edit, Write, Glob and Grep return in under a second, yet in ${tn(l.length,'task','tasks')} such calls sat for over 5 s: the agent was waiting for your approval.`,
  'Pre-approve routine tools with `permissions.allow` rules (e.g. `"Edit"`, `"Read"`) in `.claude/settings.json`, or let edits through automatically with Shift+Tab (accept edits).',by(l,t=>t.approval_s),ap)}
 const bad=tools.filter(r=>r[1]>=RULES.toolErrCalls&&r[2]/r[1]>RULES.toolErrRate).sort((x,y)=>y[2]/y[1]-x[2]/x[1]),badN=new Set(bad.map(r=>r[0]));
 if(bad.length){const n=sum(bad,r=>r[2]),hits=t=>sum(Object.entries(t.tool_stats),([k,v])=>badN.has(k)?v[1]:0);
  add('tool-errors','hi','Tools with high failure rates',bad.slice(0,5).map(r=>`${r[0]}: ${r[2]}/${r[1]} failed (${P(r[2]/r[1])})`).join(' · ')+`. Each failure costs another model round-trip${turn>=1?` (≈${T(turn)}, ${$$(turnUsd)} on average)`:''}.`,
  'Open the worst tasks and read the failing calls: wrong paths, missing tools or flaky commands. Put the right command in `CLAUDE.md` so the agent stops guessing.',by(F.filter(hits),hits),n*turn,n*turnUsd)}
 const st=F.filter(t=>t.err_streak>=RULES.errStreak);
 if(st.length){const n=sum(st,t=>t.err_streak);add('streaks','mid',`${tn(st.length,'task','tasks')} got stuck retrying: ${RULES.errStreak}+ tool failures in a row`,`Longest run: ${Math.max(...st.map(t=>t.err_streak))} consecutive failed calls.`,
  'Interrupt (Esc) once the same step fails twice and give the missing hint, or write the working approach into `CLAUDE.md`.',by(st,t=>t.err_streak),n*turn,n*turnUsd)}
 const dp=sum(F,t=>t.dup_calls);
 if(dp>=RULES.dupCalls){const l=F.filter(t=>t.dup_calls),ex=l.flatMap(t=>t.dups).sort((x,y)=>y[2]-x[2]).slice(0,3);
  add('repeats','mid',`${dp} repeated identical reads and searches`,`A Read, Grep or Glob ran again with exactly the same input${ex.length?', e.g. '+ex.map(d=>`${d[0]}${d[1]?' '+cut(d[1]):''} ×${d[2]}`).join(', '):''}. Usually the agent lost track after a compaction or a long detour.`,
  'Point the agent at the key files up front (or list them in `CLAUDE.md`), and split long tasks so the context stays small.',by(l,t=>t.dup_calls),dp*turn,dp*turnUsd)}
 const ch=F.filter(t=>t.churn.some(c=>c[1]>=RULES.churnEdits));
 if(ch.length){const ex=ch.flatMap(t=>t.churn).sort((x,y)=>y[1]-x[1]).slice(0,3),n=sum(ch,t=>sum(t.churn,c=>Math.max(0,c[1]-RULES.churnEdits)));   // edits past the threshold, each ≈ one turn
  add('churn','mid',`${tn(ch.length,'task','tasks')} edited the same file ${RULES.churnEdits}+ times`,`Most edited: ${ex.map(c=>`${c[0]?base(c[0]):'(file)'} ×${c[1]}`).join(', ')}. Many edits to one file usually mean rework or trial and error.`,
  'Agree on the approach before editing (plan mode: Shift+Tab twice), or give a precise spec: expected behaviour, constraints, and the test that must pass.',by(ch,t=>Math.max(...t.churn.map(c=>c[1]))),n*turn,n*turnUsd)}
 const big=F.filter(t=>t.ctx_max>RULES.ctxBig);
 if(big.length){const c=sum(big,t=>t.cost),cr=sum(big,t=>t.cost_mix[2]),cmp=big.flatMap(t=>t.compacts).filter(x=>x[2]);
  add('context','hi',`${tn(big.length,'task','tasks')} grew context past ${N(RULES.ctxBig)} tokens`,`Every turn re-reads the whole context: these tasks cost ${$$(c)} (${P(c/a.cost)} of spend), ${$$(cr)} of it cache reads.`+
  (cmp.length?` Their ${tn(cmp.length,'compaction','compactions')} shrank context from ${N(sum(cmp,x=>x[2])/cmp.length)} to ${N(sum(cmp,x=>x[3])/cmp.length)} tokens on average.`:''),
  'Start a fresh session (`/clear`) between unrelated tasks, and run `/compact` with a focus hint before context passes ~200k.',by(big,t=>t.ctx_max),0,cr/2)}
 const cm=F.filter(t=>t.cache_miss[0]),cmu=sum(cm,t=>t.cache_miss[2]);
 if(cmu>=RULES.cacheMissUsd)add('cache-expiry','mid',`The prompt cache expired mid-task ${sum(cm,t=>t.cache_miss[0])} times (${$$(cmu)} re-spent)`,
  `After a pause of over 5 minutes the cache is gone, so the next turn writes the whole context again: ${N(sum(cm,t=>t.cache_miss[1]))} tokens re-written.`,
  'Finish a step before taking a break, or `/clear` and restate the goal when you come back: a small fresh context is cheaper than re-caching a large one.',by(cm,t=>t.cache_miss[2]),0,cmu)
 const cw=sum(F,t=>t.cost_mix[3]);
 if(a.cost>=RULES.minSpend&&cw/a.cost>RULES.cacheWriteShare)add('cache-writes','mid',`Cache writes are ${P(cw/a.cost)} of spend`,
  'A cache write costs 1.25–2× normal input, a cache read 0.1×. A high write share means context is re-cached often: many new sessions, model switches or expired caches.',
  'Keep always-loaded context lean (`CLAUDE.md`, MCP servers you rarely use) and stay in one session for related work instead of restarting.',by(F,t=>t.cost_mix[3]))
 const sp=t=>t.interrupts+rejects(t),stops=sum(F,sp);
 if(stops>=RULES.stops){const ni=sum(F,t=>t.interrupts);add('stops','mid',`You stopped or rejected the agent ${stops} times`,
  `${tn(ni,'interrupt','interrupts')} and ${tn(stops-ni,'rejected tool call','rejected tool calls')} across ${tn(F.filter(sp).length,'task','tasks')}. Each one usually means the agent was heading the wrong way.`,
  'For bigger changes start in plan mode (Shift+Tab twice) and approve the plan first; state constraints (files to leave alone, preferred approach) in the prompt.',by(F,sp))}
 const th=F.filter(t=>t.model_s>RULES.thinkMinModel&&t.think_s/t.model_s>RULES.thinkShare);
 if(th.length)add('thinking','info',`${tn(th.length,'task','tasks')} spent over ${P(RULES.thinkShare)} of model time thinking`,`${T(sum(th,t=>t.think_s))} of thinking in total.`,
  'For routine work lower the effort level (`/effort`), or make the prompt more specific so there is less to figure out.',by(th,t=>t.think_s),sum(th,t=>t.think_s-RULES.thinkShare*t.model_s))
 const byP=Object.create(null);F.forEach(t=>(byP[t.proj]=byP[t.proj]||[]).push(t));
 // robust z-score (median / MAD) of sqrt(turns) within each project; sqrt tames the long tail turn counts always have
 const odd=Object.values(byP).filter(l=>l.length>=RULES.outlierMinTasks).flatMap(l=>{const v=l.map(t=>Math.sqrt(t.calls)),med=Q(v,.5),mad=Q(v.map(x=>Math.abs(x-med)),.5)||1;
  return l.filter((t,i)=>.6745*(v[i]-med)/mad>RULES.outlierZ).map(t=>[t,Q(l.map(t=>t.calls),.5)])}).sort((x,y)=>y[0].calls-x[0].calls);

  CHAT.usage=s.contextWindow?s.contextUsage/s.contextWindow:null}
 catch(e){if(e.name!='AbortError'){a.err=1;a.text=e.name=='NotAllowedError'?'The browser wants a click to start the model; ask again.':`The on-device model failed: ${e.message||e.name||e}`}
  else if(!a.text)a.text='(stopped)'}
 CHAT.ctl=null;saveChat();render();$('#q')?.focus()}
// model text -> escaped HTML with a small markdown subset (paragraphs, - / 1. lists, **bold**, `code`);
// [task ids] it cites become chips, but only for tasks that exist
const inl=s=>s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\[([^\]\s]+#\d+)\]/g,(m,id)=>D.tasks.some(t=>t.id==id)?chip(id):m);
function fmtAnswer(s){let h='',list='';const close=()=>{if(list)h+=`</${list}>`;list=''};
 for(const line of esc(s).split('\n')){const m=line.match(/^\s*(?:[-*•]|(\d+)[.)])\s+(.*)/);
  if(m){const k=m[1]?'ol':'ul';if(list!=k){close();h+=`<${k}>`;list=k}h+=`<li>${inl(m[2])}</li>`}else{close();if(line.trim())h+=`<p>${inl(line)}</p>`}}
 close();return h}
function chatView(){const fs=findings(F),top=[...F].sort((x,y)=>y.cost-x.cost)[0],projs=[...new Set(F.map(t=>t.proj))],busy=!!CHAT.ctl,last=CHAT.msgs.length-1;
 const sugg=['What should I fix first?',`Why did [${top.id}] cost so much?`,'Where does my idle time come from?','Which tools fail most often, and why does it matter?',
  projs.length>1?`Which tasks in ${projs[0]} were slowest?`:'Which tasks were slowest this week?',fs.some(f=>f.key=='cache-expiry')?'How much did expired caches cost me?':'How could I spend less?'];
 const sq=q=>`<button type="button" class="sq" data-q="${esc(q)}">${IC.spark}<span>${esc(q)}</span></button>`;
 const msgs=CHAT.msgs.map((m,i)=>m.role=='user'?`<div class="msg me"><div class="bub">${esc(m.text)}</div></div>`:
  `<div class="msg bot${m.err?' err':''}"><div class="spark sm">${IC.spark}</div><div class="body"><div class="who">Claudon AI <span>· on-device</span></div>`+
  `<div class="ans${busy&&i==last?' live':''}" id="m${i}">${m.text?fmtAnswer(m.text):'<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>'}</div>`+
  (m.text&&!(busy&&i==last)?`<div class="acts"><button type="button" class="ghost" data-copy="${i}">${IC.copy}Copy</button>`+
   (m.data?`<details class="seen"><summary class="ghost">${IC.data}Data the model saw</summary><pre class="pre">${esc(m.data)}</pre></details>`:'')+'</div>':'')+'</div></div>').join('');
 const scope=`${F.length.toLocaleString()} task${F.length==1?'':'s'} in view${$('#fp').value?' · '+esc($('#fp').value):''}${$('#fq').value?' · “'+esc($('#fq').value)+'”':''}`;
 return `<div class="card ai-card chatc"><div class="ai-head chat-head"><div class="spark">${IC.spark}</div><div><h2>Ask about this report</h2><div class="s">${scope}</div></div><span class="grow"></span>`+
  (CHAT.usage>=.01?`<span class="mem" title="How much of the on-device model's memory this conversation uses"><i><b style="width:${Math.min(100,CHAT.usage*100)}%"></b></i>${P(CHAT.usage)}</span>`:'')+
  `<span class="pill">On-device · Prompt API</span>${CHAT.msgs.length?`<button class="ghost" data-chat="clear">${IC.clear}Clear chat</button>`:''}</div>`+
  (AI.lm=='available'?'':`<div class="note">${IC.info}<span>Your first question asks the browser to download its built-in model once (a few GB). After that it runs on this computer, offline too; nothing is sent anywhere.</span></div>`)+
  `<div class="msgs" id="msgs" aria-live="polite">${msgs||`<div class="chat-empty"><div class="spark lg">${IC.spark}</div><h3>What would you like to know?</h3>`+
   `<p class="s">Answers use the numbers in this report, run on this computer, and link to the tasks they cite.</p><div class="sgrid">${sugg.map(sq).join('')}</div></div>`}</div>`+
  (CHAT.overflow?'<div class="aierr" style="margin:0 0 10px">The conversation no longer fits in the model\'s memory, so the oldest messages are being forgotten. Clear the chat to start fresh.</div>':'')+
  (CHAT.msgs.length&&!busy?`<div class="follow">${sugg.slice(0,5).map(sq).join('')}</div>`:'')+
  `<form id="ask" class="composer"><textarea id="q" rows="1" aria-label="Ask a question" placeholder="Ask about time, cost, tools, a project or a task…" ${busy?'disabled':''}></textarea>`+
  (busy?`<button type="button" class="send stop" data-chat="stop" aria-label="Stop" title="Stop">${IC.stop}</button>`:`<button class="send" aria-label="Send" title="Send">${IC.send}</button>`)+'</form>'+
  `<div class="s hint"><span><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span><span>Answers come from your browser's model and can be wrong; check the linked tasks.</span></div></div>`}
// after the chat view is drawn: newest message in sight, the draft and its height restored, focus in the composer
function chatMounted(){const box=$('#msgs'),q=$('#q');if(box)box.scrollTop=box.scrollHeight;
 if(q){q.value=CHAT.draft;grow(q);if(!CHAT.ctl&&document.activeElement?.tagName!='INPUT'&&document.activeElement?.tagName!='SELECT')q.focus({preventScroll:true})}}
const grow=q=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,160)+'px'};
document.addEventListener('input',e=>{if(e.target.id=='q'){CHAT.draft=e.target.value;grow(e.target)}});
document.addEventListener('submit',e=>{if(e.target.id=='ask'){e.preventDefault();ask($('#q').value)}});
document.addEventListener('keydown',e=>{if(e.target.id=='q'&&e.key=='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask(e.target.value)}});

function detail(i){const t=D.tasks[i],w=t.wall,pc=x=>(x/w*100).toFixed(3)+'%';
 const sig=[t.approval_s?`approval waits ${T(t.approval_s)}`:'',t.cache_miss[0]?`cache expired ${t.cache_miss[0]}× (${$$(t.cache_miss[2])} re-written)`:'',t.dup_calls?`${t.dup_calls} repeated reads/searches`:'',
  t.churn.length?`most edited: ${t.churn.map(c=>(c[0]?base(c[0]):'file')+' ×'+c[1]).join(', ')}`:'',t.err_streak>1?`${t.err_streak} tool failures in a row`:'',t.interrupts?tn(t.interrupts,'interrupt','interrupts'):''].filter(Boolean);
 const lanes=['model','tools','subagent'].map((n,i)=>`<div class="lane"><label>${n}</label>`+t.segs.filter(s=>i==0?s[0]=='m':i==1?(s[0]=='t'||s[0]=='te'):(s[0]=='ms'||s[0]=='ts')).map(s=>{
  const col=s[0]=='te'?'e':(s[0]=='m'||s[0]=='ms')?'m':s[0]=='ts'?'a':'t',extra=s[0][0]=='m'?`${esc(sn(s[3]))} · ${esc(s[5])} out tok · think ${T(s[4])}`:esc(s[3]+': '+s[4]);
  const th=s[0][0]=='m'&&s[4]>0?`<span class="th" style="left:${pc(s[1])};width:${pc(Math.min(s[4],s[2]))}" title="thinking ${T(s[4])}"></span>`:'';
  return `<span class="${col}" style="left:${pc(s[1])};width:${pc(s[2])}" title="${T(s[2])} — ${extra}"></span>${th}`}).join('')+'</div>').join('');
 const ctxMax=Math.max(...t.ctx.map(c=>c[1]),1),svg=t.ctx.length>1?`<svg viewBox="0 0 400 60" width="100%" height="60" preserveAspectRatio="none"><polyline fill="none" stroke="var(--model)" stroke-width="1.5" points="${t.ctx.map(c=>`${c[0]/w*400},${58-c[1]/ctxMax*54}`).join(' ')}"/></svg>`:'';
 const trows=Object.entries(t.tool_stats).map(([k,v])=>[k,...v]);
 return `<h2 style="font-size:16px">${esc(t.title||'Task')} <span class="s">· ${esc(t.proj)} · ${new Date(t.start*1000).toLocaleString()} · ${esc(t.id)}</span></h2><div class="pre">${esc(t.prompt)}</div>
 <div class="grid" style="margin:12px 0">${kpi('Wall',T(w))}${kpi('Turns',t.calls,t.sub_calls+' subagent calls')}${kpi('Tool calls',t.tools)}${kpi('Thinking',T(t.think_s),N(t.think_tok)+' tok')}${kpi('Cost',$$(t.cost)+(t.est?'*':''),'subagents '+$$(t.sub_cost))}${kpi('Peak context',N(t.ctx_max),t.compacts.length+' compactions')}</div>
 ${sig.length?`<div class="s" style="margin:-4px 0 10px">Signals: ${esc(sig.join(' · '))}</div>`:''}
 ${bar(t)}<div style="height:6px"></div>${legend}<h2 style="margin-top:14px">Timeline <span class="s">(purple = thinking portion of a model call, red = failed tool)</span></h2><div class="gantt">${lanes}</div><div class="axis">${[0,.25,.5,.75,1].map(f=>`<span>${T(w*f)}</span>`).join('')}</div>
 <div class="cols" style="margin-top:14px"><div><h2>Tools in this task</h2>${tbl('dt',[{h:'Tool',f:r=>esc(r[0]),v:r=>r[0]},{h:'Calls',n:1,f:r=>esc(r[1]),v:r=>r[1]},{h:'Err',n:1,f:r=>esc(r[2]),v:r=>r[2]},{h:'Total',n:1,d:1,f:r=>T(r[3]),v:r=>r[3]},{h:'Max',n:1,f:r=>T(r[4]),v:r=>r[4]}],trows,20)}</div>
 <div><h2>Tool calls, slowest first</h2>${tbl('ds',[{h:'Tool',f:r=>esc(r[0]),v:r=>r[0]},{h:'Dur',n:1,f:r=>T(r[1]),v:r=>r[1]},{h:'Input',f:r=>`<div class="pr" style="max-width:300px">${esc(r[2])}</div>`,v:r=>r[2]}],t.slow,10)}
 <h2 style="margin-top:12px">Context size per turn</h2>${svg}<div class="s">peak ${N(t.ctx_max)} tokens</div></div></div>`}

const views=[overview,tasksView,toolsView,modelsView,bottlenecks];
function render(){filt();document.querySelectorAll('#nav button').forEach((b,i)=>{const on=i==tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
 $('#view').innerHTML=F.length?views[tab]():'<div class="card">No tasks match.</div>';if(F.length&&views[tab]==chatView)chatMounted()}
const pl=(n,w)=>`${N(n)} ${w}${n==1?'':'s'}`;
const rates=Object.entries(D.price).sort(([a],[b])=>a.localeCompare(b)).map(([k,p])=>`<tr><td><code>${esc(k)}</code></td>${p.map(x=>`<td class="n">${x}</td>`).join('')}</tr>`).join('');
$('#foot').innerHTML=`<div class="meta">Generated ${esc(new Date(D.generated).toLocaleString())} from <code>${esc(D.root)}</code> · ${pl(D.files,'file')} · ${pl(D.sessions.length,'session')} · Developed by <b>Infenia Private Limited</b> under the MIT License</div>
 <div class="notes">
  <div><b>Definitions</b>A <b>task</b> is one human prompt through the last activity before the next prompt; a <b>turn</b> is one model API call. Subagent transcripts count toward the task that was running when they started.</div>
  <div><b>Time split</b>Interval union (model › tools › subagent › user tools), so parallel work is not double counted. <i>Idle</i> is time with no model or tool activity.</div>
  <div><b>Costs</b>Estimates: token usage × the rates below; <code>*</code> marks tasks that include models with unknown pricing. On real transcripts they land at a median ~95% of the CLI's own reported total. Advisor sub-calls and fast mode are priced; server-tool fees (e.g. web search) are not.</div>
 </div>
 <details><summary>Rates used ($ per million tokens; the longest key contained in the model name wins)</summary>
  <table><tr><th>Model key</th><th class="n">Input</th><th class="n">Output</th><th class="n">Cache read</th><th class="n">Cache write 5m</th><th class="n">Cache write 1h</th></tr>${rates}</table></details>`;
document.addEventListener('click',e=>{const el=e.target.closest('[data-t],[data-s],[data-task],[data-more],[data-ai],[data-f],[data-q],[data-chat],[data-copy]');if(!el)return;
 if(el.dataset.copy){const html=el.innerHTML;navigator.clipboard?.writeText(CHAT.msgs[+el.dataset.copy]?.text||'').then(()=>{el.textContent='Copied';setTimeout(()=>el.innerHTML=html,1200)},()=>{});return}
 if(el.dataset.q){ask(el.dataset.q);return}
 if(el.dataset.chat){if(el.dataset.chat=='stop')CHAT.ctl?.abort();else{CHAT.ctl?.abort();CHAT.msgs=[];CHAT.sess?.destroy();Object.assign(CHAT,{sess:null,overflow:false,usage:null});store.del('chat');render()}return}
 if(el.dataset.ai){el.dataset.ai=='stop'?AI.ctl?.abort():aiSummarize();return}
 if(el.dataset.f){e.preventDefault();const f=document.getElementById('f-'+el.dataset.f);if(f){f.scrollIntoView({behavior:'smooth',block:'center'});f.classList.remove('flash');void f.offsetWidth;f.classList.add('flash')}return}
 const modal=()=>{if(cur>=0&&$('#modal').style.display=='block')$('#mbody').innerHTML=detail(cur)};
 if(el.dataset.more){const[id,step]=el.dataset.more.split('|');shown[id]=step=='all'?Infinity:(shown[id]||+step)+ +step;render();modal();return}
 if(el.dataset.t!=null){tab=+el.dataset.t;render()}else if(el.dataset.s){const[id,i]=el.dataset.s.split('|'),s=sorts[id];s.d=s.i==+i?-s.d:-1;s.i=+i;render();modal()}
 else{cur=D.tasks.findIndex(x=>x.id==el.dataset.task);delete shown.dt;delete shown.ds;$('#mbody').innerHTML=detail(cur);$('#modal').style.display='block';document.body.style.overflow='hidden';$('#modal').scrollTop=0}});
const closeM=()=>{$('#modal').style.display='none';document.body.style.overflow=''};
$('#x').onclick=closeM;$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#modal').style.display=='block')closeM()});
$('#fp').onchange=$('#fq').oninput=()=>{for(const k in shown)delete shown[k];render()};render();aiDetect();  // a new filter starts tables at page 1
