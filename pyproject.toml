[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claudon"
dynamic = ["version"]
description = "Interactive session analytics & HTML dashboard for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Infenia Private Limited" }
]
keywords = ["claude", "claude-code", "analytics", "dashboard", "anthropic", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/infenia/claudon"
Repository = "https://github.com/infenia/claudon"

[project.scripts]
claudon = "claudon.cli:main"

[tool.setuptools]
packages = ["claudon"]

[tool.setuptools.package-data]
claudon = ["dashboard.html"]

[tool.setuptools.dynamic]
version = { attr = "claudon.__version__" }   # single source; scripts/check_version.py keeps package.json in sync

[tool.ruff.lint]
select = ["F", "E9"]          # pyflakes + syntax errors; the compact one-file style is intentional
