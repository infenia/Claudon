[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claudon"
version = "0.1.0"
description = "Interactive session analytics & HTML dashboard for Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Claudon Contributors" }
]
keywords = ["claude", "claude-code", "analytics", "dashboard", "anthropic", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/claudon/claudon"
Repository = "https://github.com/claudon/claudon"

[project.scripts]
claudon = "claudon:main"
