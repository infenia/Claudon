<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claudon</title>
<link rel="icon" type="image/svg+xml" href="docs/assets/logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.css">
<style>
body{margin:0;background:#0d1117}
.markdown-body{box-sizing:border-box;max-width:920px;margin:0 auto;padding:32px 20px}
.markdown-body a.open{display:inline-block;background:#3b82f6;color:#fff!important;font-weight:600;padding:12px 24px;border-radius:8px;text-decoration:none!important;margin:0}
.markdown-body .cta{text-align:center;margin:16px 0}
.markdown-body a.open:hover{background:#2563eb}
.markdown-body .markdown-alert{padding:8px 16px;margin-bottom:16px;border-left:4px solid #8957e5;border-radius:0 6px 6px 0;background:#161b22}
.markdown-body .markdown-alert-title{font-weight:600;color:#a371f7;margin-bottom:4px}
.markdown-body .ai-check{border:1px solid #30363d;border-radius:8px;padding:12px 16px;margin:0 0 16px;background:#161b22}
.markdown-body .ai-check b{display:block;margin-bottom:6px}.markdown-body .ai-check div{margin:3px 0}
</style></head>
<body><article class="markdown-body" id="md">Loading…</article>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const GH='https://github.com/infenia/claudon/blob/main/';
fetch('README.md').then(r=>r.text()).then(t=>{
  const el=document.getElementById('md');
  el.innerHTML=marked.parse(t);
  const cta='<p class="cta"><a class="open" href="app/">▶ Try it in your browser — no install</a></p>',pre=el.querySelector('pre');
  pre?pre.insertAdjacentHTML('afterend',cta):el.insertAdjacentHTML('afterbegin',cta);
  el.querySelectorAll('picture').forEach(p=>{ // site is dark-only: lazy mp4 instead of the README's webp
    const v=document.createElement('video');v.src='docs/assets/demo-dark.mp4';v.muted=v.loop=v.playsInline=true;v.preload='none';v.width=860;v.style.maxWidth='100%';
    p.replaceWith(v);new IntersectionObserver((e,o)=>e[0].isIntersecting&&(v.play(),o.disconnect())).observe(v)});
  el.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');
    if(h.startsWith('http')||h.startsWith('#')||h.startsWith('app/'))return;
    a.href=h.replace(/^\.?\/?/,GH)});
  el.querySelectorAll('img[src]').forEach(i=>{if(i.src.startsWith(location.origin)&&!i.getAttribute('src').startsWith('docs/'))i.src=GH+i.getAttribute('src')+'?raw=true'});
  el.querySelectorAll('h1,h2,h3,h4').forEach(h=>h.id=h.id||h.textContent.trim().toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-'));   // README anchors
  el.querySelectorAll('blockquote').forEach(q=>{const p=q.querySelector('p'),m=p&&p.innerHTML.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/);
    if(!m)return;p.innerHTML=p.innerHTML.slice(m[0].length);    // GitHub alert syntax, which marked leaves as text
    const d=document.createElement('div');d.className='markdown-alert markdown-alert-'+m[1].toLowerCase();
    d.innerHTML='<p class="markdown-alert-title">'+m[1][0]+m[1].slice(1).toLowerCase()+'</p>'+q.innerHTML;q.replaceWith(d);
    if(d.closest('article')&&d.previousElementSibling?.id=='on-device-ai-optional')aiCheck(d)});
}).catch(e=>document.getElementById('md').textContent='Could not load README: '+e);
// live check: which of the report's optional AI features this browser can run (same detection as the dashboard)
async function aiCheck(after){const box=document.createElement('div');box.className='ai-check';after.after(box);
  box.innerHTML='<b>Your browser</b><div>Checking for built-in AI support…</div>';
  const ask=async(api,o)=>{try{return typeof api?.availability=='function'?await Promise.race([api.availability(o),new Promise(r=>setTimeout(()=>r('unknown'),8000))]):'unavailable'}catch{return 'unavailable'}};
  const [lm,sm]=await Promise.all([ask(self.LanguageModel,{expectedInputs:[{type:'text',languages:['en']}],expectedOutputs:[{type:'text',languages:['en']}]}),
    ask(self.Summarizer,{type:'key-points',format:'plain-text',expectedInputLanguages:['en'],outputLanguage:'en'})]);
  const ok=a=>a=='available'||a=='downloadable'||a=='downloading',dl=a=>a=='downloadable'||a=='downloading'?' (the browser downloads its model once, on first use)':'';
  const why=lm=='unknown'||sm=='unknown'?'the browser did not answer; reload to check again':
    !self.LanguageModel&&!self.Summarizer?'this browser has no built-in AI APIs':'the browser reports that this device can\'t run its model';
  box.innerHTML='<b>Your browser</b>'+
    (ok(lm)||ok(sm)?`<div>✅ AI summary: supported${dl(ok(lm)?lm:sm)}</div>`:`<div>❌ AI summary: not supported (${why})</div>`)+
    (ok(lm)?`<div>✅ Ask AI chat: supported${dl(lm)}</div>`:`<div>❌ Ask AI chat: not supported (${ok(sm)?'needs the Prompt API: Chrome 148+, or Edge with its flag':why})</div>`)+
    '<div>✅ Everything else in the report works in this browser.</div>'}
</script></body></html>
