<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claudon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.css">
<style>
body{margin:0;background:#0d1117}
.markdown-body{box-sizing:border-box;max-width:920px;margin:0 auto;padding:32px 20px}
.markdown-body a.open{display:inline-block;background:#3b82f6;color:#fff!important;font-weight:600;padding:12px 24px;border-radius:8px;text-decoration:none!important;margin:0}
.markdown-body .cta{text-align:center;margin:16px 0}
.markdown-body a.open:hover{background:#2563eb}
</style></head>
<body><article class="markdown-body" id="md">Loading…</article>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const GH='https://github.com/infenia/claudon/blob/main/';
fetch('README.md').then(r=>r.text()).then(t=>{
  const el=document.getElementById('md');
  el.innerHTML=marked.parse(t);
  const cta='<p class="cta"><a class="open" href="app/">▶ Try it in your browser — no install</a></p>',pre=el.querySelector('pre');
  pre?pre.insertAdjacentHTML('afterend',cta):el.insertAdjacentHTML('afterbegin',cta);
  el.querySelectorAll('picture').forEach(p=>{ // site is dark-only: lazy mp4 instead of the README's webp
    const v=document.createElement('video');v.src='docs/assets/demo-dark.mp4';v.muted=v.loop=v.playsInline=true;v.preload='none';v.width=860;v.style.maxWidth='100%';
    p.replaceWith(v);new IntersectionObserver((e,o)=>e[0].isIntersecting&&(v.play(),o.disconnect())).observe(v)});
  el.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');
    if(h.startsWith('http')||h.startsWith('#')||h.startsWith('app/'))return;
    a.href=h.replace(/^\.?\/?/,GH)});
  el.querySelectorAll('img[src]').forEach(i=>{if(i.src.startsWith(location.origin)&&!i.getAttribute('src').startsWith('docs/'))i.src=GH+i.getAttribute('src')+'?raw=true'});
}).catch(e=>document.getElementById('md').textContent='Could not load README: '+e);
</script></body></html>
